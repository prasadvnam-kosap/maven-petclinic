# OVERHEAD measurement — maven-petclinic. RESEARCH, TEMPORARY (2026-09-14).
#
# Installed by depproof-research/behaviour/ci/overhead-install.sh, which embeds the measurement runner
# and the behaviour recorder settings below as base64. If the behaviour-evidence work is not pursued,
# remove with `overhead-install.sh --remove`; note that removal leaves the file in this private fork's
# git history — delete the branch or recreate the fork for a full removal.
#
# Arms, back to back on ONE runner, randomised order per pair:
#   A-none        the suite as the repo runs it
#   B-loaded      + today's LOADED capture (class-load log)
#   C-behaviour   + LOADED + the behaviour recorder (JFR: socket, file, process, deserialisation, stacks)

name: Overhead — petclinic

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit or branch to measure (the corpus pin by default)
        required: false
        default: 'depproof-pinned'
      pairs:
        description: Paired repetitions of every arm
        required: false
        default: '3'

permissions:
  contents: read

jobs:
  overhead:
    runs-on: ubuntu-latest          # declared by the repo
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up JDK 17 (as the repo declares)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build (untraced)
        run: ./mvnw -B -DskipTests package

      - name: Write the measurement harness
        run: |
          mkdir -p .github/depproof
          echo '' | base64 -d > .github/depproof/overhead-run.py
          echo '' | base64 -d > .github/depproof/behaviour.jfc
          cat > .github/depproof/arms.json <<'JSON'
          [
            {"name": "A-none", "cmd": "./mvnw -B verify"},
            {"name": "B-loaded", "cmd": "./mvnw -B verify",
             "env": {"JAVA_TOOL_OPTIONS": "-Xlog:class+load=info:file={TRACE}/trace-%p.log"}},
            {"name": "C-behaviour", "cmd": "./mvnw -B verify",
             "env": {"JAVA_TOOL_OPTIONS": "-Xlog:class+load=info:file={TRACE}/trace-%p.log -XX:StartFlightRecording:filename={TRACE}/rec-%p.jfr,settings={WS}/.github/depproof/behaviour.jfc,dumponexit=true"}}
          ]
          JSON

      - name: Measure (${{ inputs.pairs }} pairs + 1 warm-up)
        run: python3 .github/depproof/overhead-run.py .github/depproof/arms.json "${{ inputs.pairs }}" overhead "${{ github.run_id }}" 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: overhead-petclinic
          path: |
            overhead/results.tsv
            overhead/summary.txt
            overhead/logs/
          retention-days: 14
